name: Build and test .NET projects

on:
  push:
    branches:
      - develop
      - latest
      - releases/*
  create:
    branches:
      - releases/*
    tags:
      - releases/*

  pull_request:
    branches:
      - develop

jobs:
  build_and_test:
    name: Build & Test - ${{ matrix.configuration }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        framework: [net10.0]
    steps:
      - uses: actions/checkout@v1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c ${{ matrix.configuration }} /p:BuildInParallel=false

      - name: Test
        id: tests
        run: |
          dotnet test -c ${{ matrix.configuration }} --no-build --no-restore /p:BuildInParallel=false
