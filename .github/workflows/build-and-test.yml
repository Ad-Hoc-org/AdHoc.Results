name: Build and test .NET projects

on: 
  push:
    branches:
      - develop
      - latest
      - releases/*
  create:
    branches:
      - releases/*
    tags:
      - releases/*
    
  pull_request:
    branches: 
    - develop

jobs:
  build:
    name: Build ${{ matrix.display-name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: ['Debug', 'Release']
        include:
        - configuration: 'Debug'
          display-name: 'Debug'
        - configuration: 'Release'
          display-name: 'Release'
    steps:
      - uses: actions/checkout@v1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c ${{ matrix.configuration }} /p:BuildInParallel=false

  test:
    name: Test ${{ matrix.configuration-name }} - ${{ matrix.framework }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: ['Debug', 'Release']
        dotnet-version: ['10.0']
        include:
        - dotnet-version: '10.0'
          framework: 'net10.0'
          install-version: '10.0.x'
        - configuration: 'Debug'
          configuration-name: 'Debug'
        - configuration: 'Release'
          configuration-name: 'Release'
    steps:
    - uses: actions/checkout@v1
    
    - name: Setup ${{ matrix.framework }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.install-version }}
    - name: Setup .net10.0
      uses: actions/setup-dotnet@v4
      if: ${{ matrix.install-version != '10.0.x' }}
      with:
        dotnet-version: 10.0.x

    - name: Test
      id: tests
      run: |
        dotnet test -f ${{ matrix.framework }} -c ${{ matrix.configuration }} /p:BuildInParallel=false
